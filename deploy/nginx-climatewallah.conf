server {
    listen 80;
    listen [::]:80;
    server_name climatewallah.com www.climatewallah.com;

    root /var/www/climatewallah/frontend/build;
    index index.html;
    client_max_body_size 20M;

    # ^~ is required here. Without it, a URL such as
    # /api/uploads/evidence/file.png can be captured by the static-file regex
    # below and incorrectly return the React/Nginx 404 page.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # Keep API schemas private in production. Remove this block if protected
    # documentation access is intentionally configured.
    location ~ ^/(docs|redoc|openapi.json)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
